[package]
name = "srbehunin-proto"
version = "0.1.0"
edition = "2024"
description = "A server and client stub for SRBehunin, backed by ConnectRPC codegen tooling."
license = "MIT"
repository = "https://github.com/srbehunin/srbehunin-proto/"

[dependencies]
connectrpc = { version = "0.9", features = ["client"] }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
