version: v2
managed:
    enabled: true
    override:
        - file_option: go_package_prefix
          value: github.com/sophloaf2019/srbehunin-proto/gen/go
plugins:
    # Rust: protobuf messages + tonic service stubs
    - local: protoc-gen-prost
      out: gen/rust/src
    - local: protoc-gen-prost-serde
      out: gen/rust/src
    - local: protoc-gen-tonic
      out: gen/rust/src
    - local: protoc-gen-prost-crate
      out: gen/rust
      strategy: all
      opt:
          - gen_crate=gen/rust/Cargo.toml.tpl

    # Go: protobuf messages + gRPC stubs
    - local: protoc-gen-go
      out: gen/go
      opt:
          - paths=source_relative
    - local: protoc-gen-go-grpc
      out: gen/go
      opt:
          - paths=source_relative

    # TypeScript: protobuf messages + Connect client (using gRPC-Web transport)
    - local: protoc-gen-es
      out: gen/ts
      opt:
          - target=ts
          - import_extension=ts
    - local: protoc-gen-connect-es
      out: gen/ts
      opt:
          - target=ts
          - import_extension=ts
